
name: Build Nuvio Bridge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Nuvio Bridge source
        run: |
          unzip -o NuvioBridge.zip -d source

      - name: Build debug APK
        run: |
          gradle --no-daemon -p source/NuvioBridge assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioBridge-debug-apk
          path: source/NuvioBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
